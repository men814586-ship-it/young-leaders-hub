<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Young Leaders Hub</title>
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin/admin.css?v=1">
</head>
<body>

<!-- Sign in -->
<div class="login hidden" id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">
      <img src="assets/img/logo-icon.png" alt="">
      <div><h1>Admin panel</h1><p class="sub">Young Leaders Hub</p></div>
    </div>
    <div id="setupNote" class="setup-note hidden"></div>
    <div id="loginErr" class="err hidden" role="alert"></div>
    <label class="f"><span>Username</span><input class="input" name="username" autocomplete="username" required autofocus></label>
    <label class="f"><span>Password</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" style="width:100%;padding:11px" type="submit">Sign in</button>
    <p class="faint" style="font-size:12px;text-align:center;margin:16px 0 0">Staff only. Every sign-in is recorded in the activity log.</p>
  </form>
</div>

<!-- App -->
<div class="app hidden" id="app">
  <aside class="side" id="side">
    <a class="brand" href="index.html" target="_blank" rel="noopener" title="Open the website">
      <img src="assets/img/logo-icon.png" alt="">
      <span><b>Young Leaders Hub</b><small>Admin panel</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <div class="avatar-sm" id="meAvatar">A</div>
      <div><b id="meName">—</b><small id="meRole">—</small></div>
      <button id="logout" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><h2 id="pageTitle">Dashboard</h2><div class="sub" id="pageSub"></div></div>
      <div class="grow"></div>
      <div id="topActions" class="row"></div>
      <a class="btn btn-ghost btn-sm hide-sm" href="index.html" target="_blank" rel="noopener">View website ↗</a>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="publish-bar" id="publishBar">
  <span class="dot"></span>
  <div class="grow"><b>Unsaved changes</b> <span class="hide-sm" style="opacity:.75">— visitors still see the old version until you publish.</span></div>
  <button class="btn btn-ghost btn-sm" id="discardBtn">Discard</button>
  <button class="btn btn-primary" id="publishBtn">Publish to website</button>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog">
  <div class="drawer-h"><h3 id="drawerTitle"></h3><button class="x" id="drawerClose" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f" id="drawerFoot"></div>
</aside>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" class="hidden">

<script src="assets/admin/admin.js?v=1"></script>
</body>
</html>
